[workspace]
members = ["crates/scenetrace-core", "crates/scenetrace-cli"]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
