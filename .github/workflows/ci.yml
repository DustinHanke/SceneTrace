name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: python -m pip install pytest
      - run: pytest -q
      - run: python -m py_compile blender/scenetrace/*.py scripts/*.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --release

  blender-smoke-linux:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Blender 4.4
        run: |
          mkdir -p .tooling
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.0-linux-x64.tar.xz -o .tooling/blender.tar.xz
          tar -xf .tooling/blender.tar.xz -C .tooling
          echo "BLENDER_PATH=$PWD/.tooling/blender-4.4.0-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Build extension package
        run: |
          "$BLENDER_PATH" --factory-startup --command extension build --source-dir blender/scenetrace --output-filepath "$RUNNER_TEMP/scenetrace-blender.zip"
          if unzip -Z1 "$RUNNER_TEMP/scenetrace-blender.zip" | grep -Fxq headless.py; then
            echo "Extension package must not include headless.py" >&2
            exit 1
          fi
      - name: Generate baseline scene
        run: |
          "$BLENDER_PATH" --factory-startup --background --python scripts/generate_demo.py -- "$RUNNER_TEMP/scenetrace-demo/demo.blend"
          cargo run -p scenetrace -- baseline "$RUNNER_TEMP/scenetrace-demo" --workers 1 --json > "$RUNNER_TEMP/baseline.json"
          cargo run -p scenetrace -- test "$RUNNER_TEMP/scenetrace-demo" --workers 1 --json > "$RUNNER_TEMP/unchanged.json"
      - name: Detect known regression
        run: |
          "$BLENDER_PATH" --factory-startup --background --python scripts/generate_demo.py -- "$RUNNER_TEMP/scenetrace-demo/demo.blend" --regression
          set +e
          cargo run -p scenetrace -- test "$RUNNER_TEMP/scenetrace-demo" --workers 1 --json > "$RUNNER_TEMP/regression.json"
          status=$?
          test "$status" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: scenetrace-linux-artifacts
          path: ${{ runner.temp }}/*.json

  blender-smoke-windows:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Blender 4.4
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tooling | Out-Null
          Invoke-WebRequest https://download.blender.org/release/Blender4.4/blender-4.4.0-windows-x64.zip -OutFile .tooling/blender.zip
          Expand-Archive .tooling/blender.zip -DestinationPath .tooling
          "BLENDER_PATH=$((Resolve-Path .tooling/blender-4.4.0-windows-x64/blender.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Exercise baseline, pass, and regression
        shell: pwsh
        run: |
          & $env:BLENDER_PATH --factory-startup --background --python scripts/generate_demo.py -- "$env:RUNNER_TEMP/scenetrace-demo/demo.blend"
          cargo run -p scenetrace -- baseline "$env:RUNNER_TEMP/scenetrace-demo" --workers 1 --json | Out-File "$env:RUNNER_TEMP/baseline.json"
          cargo run -p scenetrace -- test "$env:RUNNER_TEMP/scenetrace-demo" --workers 1 --json | Out-File "$env:RUNNER_TEMP/unchanged.json"
          & $env:BLENDER_PATH --factory-startup --background --python scripts/generate_demo.py -- "$env:RUNNER_TEMP/scenetrace-demo/demo.blend" --regression
          cargo run -p scenetrace -- test "$env:RUNNER_TEMP/scenetrace-demo" --workers 1 --json | Out-File "$env:RUNNER_TEMP/regression.json"
          if ($LASTEXITCODE -ne 1) { throw "Expected regression exit code 1, got $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: scenetrace-windows-artifacts
          path: ${{ runner.temp }}/*.json
