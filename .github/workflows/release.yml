name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: scenetrace
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: scenetrace.exe
            extension: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: scenetrace
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release CLI
        run: cargo build --release --target ${{ matrix.target }} -p scenetrace
      - name: Package Unix archive and checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version#.}"
          archive="scenetrace-${version}-${{ matrix.target }}.${{ matrix.extension }}"
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" release/
          cp blender/scenetrace/headless.py release/headless.py
          tar -C release -czf "release/${archive}" "${{ matrix.executable }}" headless.py
          tar -tf "release/${archive}" | grep -qx headless.py
          rm "release/${{ matrix.executable }}"
          rm release/headless.py
          shasum -a 256 "release/${archive}" > "release/${archive}.sha256"
      - name: Package Windows archive and checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v').TrimStart('.')
          $archive = "scenetrace-$version-${{ matrix.target }}.${{ matrix.extension }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" release/
          Copy-Item blender/scenetrace/headless.py release/
          Compress-Archive -Path "release/${{ matrix.executable }}", "release/headless.py" -DestinationPath "release/$archive"
          if ((tar -tf "release/$archive") -notcontains "headless.py") { throw "Release archive is missing headless.py" }
          Remove-Item "release/${{ matrix.executable }}"
          Remove-Item release/headless.py
          (Get-FileHash "release/$archive" -Algorithm SHA256).Hash.ToLowerInvariant() + "  $archive" | Set-Content "release/$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: scenetrace-${{ matrix.target }}
          path: release/

  extension:
    name: Build Blender extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.4
        run: |
          mkdir -p .tooling
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.0-linux-x64.tar.xz -o .tooling/blender.tar.xz
          tar -xf .tooling/blender.tar.xz -C .tooling
      - name: Package extension with Blender
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version#.}"
          mkdir -p release
          .tooling/blender-4.4.0-linux-x64/blender --factory-startup --command extension build --source-dir blender/scenetrace --output-filepath "release/scenetrace-blender-${version}.zip"
          if unzip -Z1 "release/scenetrace-blender-${version}.zip" | grep -Fxq headless.py; then
            echo "Extension package must not include headless.py" >&2
            exit 1
          fi
          shasum -a 256 "release/scenetrace-blender-${version}.zip" > "release/scenetrace-blender-${version}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: scenetrace-blender-extension
          path: release/

  publish:
    name: Publish release assets
    needs: [package, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scenetrace-*
          path: dist
          merge-multiple: true
      - name: Attach artifacts to the tagged GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
