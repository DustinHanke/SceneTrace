schema_version = "1.0.0"
id = "scenetrace"
version = "1.0.3"
name = "SceneTrace"
tagline = "Performance regression testing for Blender scenes"
maintainer = "SceneTrace contributors"
type = "add-on"
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Save SceneTrace baselines and reports next to the .blend file"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.zip",
  "headless.py",
]
